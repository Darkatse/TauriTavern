<div class="wide100p">
    <div class="flex-container alignItemsBaseline">
        <h3 class="margin0">
            <span data-i18n="Model">Model</span>
            <a href="https://docs.sillytavern.app/usage/core-concepts/connection-profiles" target="_blank" class="notes-link">
                <span class="fa-solid fa-circle-question note-link-span"></span>
            </a>
        </h3>
        <i id="connection_profile_spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
    </div>
    <div class="flex-container">
        <select class="text_pole flex1" id="connection_profiles"></select>
        <i id="view_connection_profile" class="menu_button fa-solid fa-info-circle" title="View details" data-i18n="[title]View details"></i>
        <i id="create_connection_profile" class="menu_button fa-solid fa-file-circle-plus" title="Save the current model" data-i18n="[title]Save the current model"></i>
        <i id="update_connection_profile" class="menu_button fa-solid fa-save" title="Overwrite with the current settings" data-i18n="[title]Overwrite with the current settings"></i>
        <i id="edit_connection_profile" class="menu_button fa-solid fa-pencil" title="Rename" data-i18n="[title]Rename"></i>
        <i id="reload_connection_profile" class="menu_button fa-solid fa-recycle" title="Reapply" data-i18n="[title]Reapply"></i>
        <i id="delete_connection_profile" class="menu_button fa-solid fa-trash-can" title="Delete" data-i18n="[title]Delete"></i>
    </div>
    <div id="connection_profile_details_content" class="hidden"></div>
</div>
