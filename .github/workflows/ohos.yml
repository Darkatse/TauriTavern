name: Experimental OpenHarmony HAP
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_version:
        type: string
        required: true
      asset_time:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ohos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    container:
      image: ghcr.io/leenhawk/tauri-harmony@sha256:01cfb6a9fa7fa35f1cf756fb89d4333d272820b66fe8dcf032375911eebddfdd
    defaults:
      run:
        shell: bash
    env:
      TARGET_TRIPLE: ${{ matrix.arch }}-unknown-linux-ohos
      PACKAGE_VERSION: ${{ inputs.package_version }}
      TAURITAVERN_BUILD_BRANCH: ${{ github.ref_name }}
      TAURITAVERN_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: git config --global --add safe.directory "$PWD"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-rust-crate-boundaries.mjs
      - run: python3 scripts/ohos/prepare.py
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ohos-hap-${{ matrix.arch }}
          cache-on-failure: true
      - run: pnpm run web:build
      - name: Build unsigned HAP
        run: |
          source scripts/ohos/env.sh
          export TAURITAVERN_SKIP_WEB_BUILD=1
          export PATH="$HARMONY_TOOLS_DIR/command-line-tools/tool/node/bin:$HARMONY_TOOLS_DIR/command-line-tools/bin:$PATH"
          python3 scripts/ohos/sync-version.py
          ohos_plugins_dir="$(cat src-tauri/crates/tauritavern/gen/ohos-plugins-source)"
          python3 "$ohos_plugins_dir/shared/ohos/install.py" src-tauri/crates/tauritavern --sources-only
          config_args=(--config src-tauri/crates/tauritavern/tauri.ohos.conf.json)
          if [ -n "$PACKAGE_VERSION" ]; then
            config_args+=(--config "$(jq -cn --arg version "$PACKAGE_VERSION" '{version: $version}')")
          fi
          node scripts/tauri-app.mjs ohos build --ci --target "${{ matrix.arch }}" --ignore-version-mismatches "${config_args[@]}" -- --lib
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TauriTavern-${{ inputs.asset_time || github.run_number }}-canary-ohos-${{ matrix.arch }}-hap
          path: src-tauri/crates/tauritavern/gen/ohos/entry/build/default/outputs/default/*.hap
          if-no-files-found: error
