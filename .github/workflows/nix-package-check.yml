name: Nix check and Flatpak refresh

on:
  schedule:
    # Validate dev two hours before the daily Canary scheduler. GitHub cron uses UTC.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-package-check
  cancel-in-progress: true

jobs:
  check:
    name: evaluate-and-fetch-dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - uses: cachix/install-nix-action@v31

      - name: Evaluate all supported systems
        run: >-
          nix
          --accept-flake-config
          flake check
          --all-systems
          --no-build

      - name: Verify fixed dependency closures
        # Rebuild so a cached output cannot hide a stale lockfile hash.
        run: |
          nix --accept-flake-config build \
            .#packages.x86_64-linux.canary.cargoDeps \
            .#packages.x86_64-linux.canary.pnpmDeps \
            --no-link --print-build-logs
          nix --accept-flake-config build \
            .#packages.x86_64-linux.canary.pnpmDeps \
            --rebuild --no-link --print-build-logs

  refresh-flatpak:
    name: refresh-flatpak-sources
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known

      - name: Generate Flatpak dependency sources
        run: bash packaging/flatpak/generate-sources.sh

      - name: Commit updated dependency sources
        run: |
          git add packaging/flatpak/cargo-sources.json packaging/flatpak/pnpm-sources.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(flatpak): refresh dependency sources"
          git push origin HEAD:dev
