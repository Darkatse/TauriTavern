name: Stable Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, for example v2.2.0
        required: true
        type: string

concurrency:
  group: stable-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=${EVENT_TAG:-$INPUT_TAG}
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Validate stable release identity
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName)
          test "$(jq -r '.isDraft' <<< "$release_json")" = false
          test "$(jq -r '.isPrerelease' <<< "$release_json")" = false
          test "$(jq -r '.tagName' <<< "$release_json")" = "$RELEASE_TAG"

          version=$(node scripts/ci/verify-release-version.mjs "$RELEASE_TAG")
          commit=$(git rev-parse HEAD)
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target_args: ""
            portable: true
            portable_name: windows-x64
          - platform: macos-latest
            target_args: --target x86_64-apple-darwin
            portable: false
          - platform: macos-latest
            target_args: --target aarch64-apple-darwin
            portable: false
          - platform: ubuntu-22.04
            target_args: --bundles appimage,deb,rpm
            portable: true
            portable_name: linux-x64
          - platform: ubuntu-22.04-arm
            target_args: --bundles deb,rpm
            portable: true
            portable_name: linux-arm64

    runs-on: ${{ matrix.platform }}
    env:
      TAURITAVERN_BUILD_BRANCH: main
      TAURITAVERN_BUILD_REVISION: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-alsa gstreamer1.0-pulseaudio
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          else
            sudo apt-get install -y libappindicator3-dev
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Setup macOS signing and notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: ./scripts/ci/setup-macos-signing.sh

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          args: ${{ matrix.target_args }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: 'TauriTavern-${{ needs.prepare.outputs.version }}-[platform]-[arch]-[bundle]'

      - name: Build portable binary
        if: matrix.portable
        run: node scripts/build-portable.mjs --skip-web-build --output-dir portable

      - name: Upload portable binary
        if: matrix.portable
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-${{ needs.prepare.outputs.version }}-${{ matrix.portable_name }}-portable
          path: portable/*
          if-no-files-found: error

  mobile:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - mobile: android
            platform: ubuntu-latest
            args: --verbose --apk --split-per-abi --target aarch64 armv7
          - mobile: ios
            platform: macos-latest
            args: --verbose

    runs-on: ${{ matrix.platform }}
    env:
      TAURITAVERN_BUILD_BRANCH: main
      TAURITAVERN_BUILD_REVISION: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Android host dependencies
        if: matrix.mobile == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.mobile == 'android' && 'aarch64-linux-android,armv7-linux-androideabi' || 'aarch64-apple-ios' }}

      - name: Setup JDK
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            src-tauri/crates/tauritavern/gen/android/**/*.gradle*
            src-tauri/crates/tauritavern/gen/android/**/gradle-wrapper.properties

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        if: matrix.mobile == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Setup Android signing
        if: matrix.mobile == 'android'
        shell: bash
        run: |
          cd src-tauri/crates/tauritavern/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Setup App Store Connect API key
        if: matrix.mobile == 'ios'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER secret}"
          : "${APPLE_API_KEY:?Missing APPLE_API_KEY secret}"
          : "${APPLE_API_KEY_P8:?Missing APPLE_API_KEY_P8 secret}"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build mobile bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ matrix.mobile == 'android' && steps.setup-ndk.outputs.ndk-path || '' }}
          APPLE_API_ISSUER: ${{ matrix.mobile == 'ios' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.mobile == 'ios' && secrets.APPLE_API_KEY || '' }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: ${{ matrix.mobile }}
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          uploadPlainBinary: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: 'TauriTavern-${{ needs.prepare.outputs.version }}-[platform]-[arch]-[bundle]'

  publish-release:
    needs: [prepare, desktop, mobile]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      ASSET_PREFIX: TauriTavern-${{ needs.prepare.outputs.version }}-
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: 'TauriTavern-${{ needs.prepare.outputs.version }}-*'
          path: dist

      - name: Validate and collect release assets
        run: node source/scripts/ci/collect-release-assets.mjs dist release-assets "$ASSET_PREFIX"

      - name: Upload assets without changing release notes
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -name "${ASSET_PREFIX}*" -print0 \
            | xargs -0 gh release upload "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber

  publish-package-repositories:
    needs: [prepare, publish-release]
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: https://feb4df7b9167cb2a5c75b327584225b5.r2.cloudflarestorage.com
      PACKAGES_R2_BUCKET: tauritavern-packages
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_RPM_RELEASE: "1"
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      LINUX_REPOSITORY_SIGNING_FPR: D609D0B174E0073BB3980A1BEDC6CEF924B6C529
      RELEASE_ASSETS_DIR: dist
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: 'TauriTavern-${{ needs.prepare.outputs.version }}-*'
          path: dist

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apt-utils awscli createrepo-c gnupg2 jq rpm

      - name: Import repository signing subkey
        id: signing
        shell: bash
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_REPOSITORY_GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_REPOSITORY_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${GPG_PRIVATE_KEY_BASE64:?Missing LINUX_REPOSITORY_GPG_PRIVATE_KEY_BASE64 secret}"
          key_file="$RUNNER_TEMP/tauritavern-repository-private-key.asc"
          passphrase_file="$RUNNER_TEMP/tauritavern-repository-passphrase"
          umask 077
          printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"
          printf '%s' "$GPG_PASSPHRASE" > "$passphrase_file"
          gpg --batch --import "$key_file"
          gpg --batch --with-colons --with-subkey-fingerprint \
            --list-secret-keys "$LINUX_REPOSITORY_SIGNING_FPR" \
            | awk -F: -v expected="$LINUX_REPOSITORY_SIGNING_FPR" \
                '$1 == "fpr" && $10 == expected { found = 1 } END { exit !found }'
          echo "passphrase_file=$passphrase_file" >> "$GITHUB_OUTPUT"

      - name: Publish signed APT and RPM repositories
        env:
          LINUX_REPOSITORY_GPG_PASSPHRASE_FILE: ${{ steps.signing.outputs.passphrase_file }}
        run: ./scripts/ci/publish-linux-repositories.sh

      - name: Verify public repository pointers
        run: |
          curl -fsSL https://packages.tauritavern.com/apt/dists/stable/InRelease \
            | gpg --batch --verify
          curl -fsSL \
            https://packages.tauritavern.com/rpm/fedora/stable/x86_64/repodata/repomd.xml \
            >/dev/null
          curl -fsSL \
            https://packages.tauritavern.com/rpm/opensuse/16.0/x86_64/repodata/repomd.xml \
            >/dev/null

  publish-nix-cache:
    needs: [prepare, publish-release]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-22.04
          - system: aarch64-linux
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: https://feb4df7b9167cb2a5c75b327584225b5.r2.cloudflarestorage.com
      NIX_R2_BUCKET: tauritavern-nix-cache
      NIX_CACHE_URL: https://nix-cache.tauritavern.com
      NIX_CACHE_PUBLIC_KEY: nix-cache.tauritavern.com-1:mOl/sCsfndubNIhnLODjA7GPqk1qw5iknbayZLRn92U=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: cachix/install-nix-action@v31

      - name: Build release flake
        run: >-
          nix
          --accept-flake-config
          build
          .#tauritavern
          --print-build-logs

      - name: Sign and publish runtime and dependency paths
        env:
          NIX_CACHE_PRIVATE_KEY_BASE64: ${{ secrets.NIX_CACHE_PRIVATE_KEY_BASE64 }}
        run: |
          cargo_deps=$(nix eval --raw \
            ".#packages.${{ matrix.system }}.tauritavern.cargoDeps.outPath")
          pnpm_deps=$(nix eval --raw \
            ".#packages.${{ matrix.system }}.tauritavern.pnpmDeps.outPath")
          ./scripts/ci/publish-nix-cache.sh "$cargo_deps" "$pnpm_deps"

      - name: Verify public Nix cache
        run: curl -fsSL https://nix-cache.tauritavern.com/nix-cache-info
