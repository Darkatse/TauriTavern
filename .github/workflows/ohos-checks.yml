name: OHOS change existing checks
on:
  push:
    paths: [.github/workflows/ohos-checks.yml]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libwebkit2gtk-4.1-dev librsvg2-dev pkg-config
      - run: npm install -g pnpm@11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
