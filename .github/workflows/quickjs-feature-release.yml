name: QuickJS Feature Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'quickjs-build*'
      - 'quickjs-release*'

concurrency:
  group: quickjs-feature-release
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURITAVERN_BUILD_BRANCH: feature/quickjs-script-engine
  TAURITAVERN_BUILD_REVISION: ${{ github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      asset_time: ${{ steps.metadata.outputs.asset_time }}
      display_time: ${{ steps.metadata.outputs.display_time }}
      previous_sha: ${{ steps.metadata.outputs.previous_sha }}
      sha12: ${{ steps.metadata.outputs.sha12 }}
      stable_version: ${{ steps.metadata.outputs.stable_version }}
      deb_version: ${{ steps.metadata.outputs.deb_version }}
      rpm_release: ${{ steps.metadata.outputs.rpm_release }}
      feature_tag: ${{ steps.metadata.outputs.feature_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Feature metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          feature_tag="QuickJS-Feature"
          git fetch --force origin "refs/tags/$feature_tag:refs/tags/$feature_tag" || true
          if git rev-parse -q --verify "refs/tags/$feature_tag^{commit}" >/dev/null; then
            previous_sha=$(git rev-parse "$feature_tag^{commit}")
          else
            previous_sha=$(git rev-list --max-parents=0 HEAD)
          fi
          stable_version="0.0.0"
          stable_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ "$stable_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            stable_version=${BASH_REMATCH[1]}
          fi
          asset_time=$(TZ=Asia/Shanghai date +'%Y%m%d')
          {
            echo "asset_time=$asset_time"
            echo "display_time=$(TZ=Asia/Shanghai date +'%Y.%m.%d')"
            echo "previous_sha=$previous_sha"
            echo "sha12=${GITHUB_SHA:0:12}"
            echo "stable_version=$stable_version"
            echo "feature_tag=$feature_tag"
            echo "deb_version=${stable_version}+quickjs.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA:0:12}"
            echo "rpm_release=2.quickjs.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target_args: ""
            portable: true
            portable_name: windows-x64
          - platform: macos-latest
            target_args: --target x86_64-apple-darwin
            portable: false
          - platform: macos-latest
            target_args: --target aarch64-apple-darwin
            portable: false
          - platform: ubuntu-22.04
            target_args: --bundles appimage,deb,rpm
            portable: true
            portable_name: linux-x64
          - platform: ubuntu-22.04-arm
            target_args: --bundles deb,rpm
            portable: true
            portable_name: linux-arm64

    runs-on: ${{ matrix.platform }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq libwebkit2gtk-4.1-dev librsvg2-dev patchelf rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-alsa gstreamer1.0-pulseaudio

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare Linux Feature package version
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        id: linux-version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.stable_version }}
          RPM_RELEASE: ${{ needs.prepare.outputs.rpm_release }}
        run: |
          set -euo pipefail
          config_path="$RUNNER_TEMP/tauritavern-quickjs.json"
          jq -n \
            --arg version "$PACKAGE_VERSION" \
            --arg release "$RPM_RELEASE" \
            '{version: $version, bundle: {linux: {rpm: {release: $release}}}}' \
            > "$config_path"
          echo "config_path=$config_path" >> "$GITHUB_OUTPUT"

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          args: ${{ startsWith(matrix.platform, 'ubuntu-22.04') && format('{0} --config {1}', matrix.target_args, steps.linux-version.outputs.config_path) || matrix.target_args }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: 'TauriTavern-${{ needs.prepare.outputs.asset_time }}-quickjs-[platform]-[arch]-[bundle]'

      - name: Build portable binary
        if: matrix.portable
        run: node scripts/build-portable.mjs --skip-web-build --output-dir portable

      - name: Upload portable binary
        if: matrix.portable
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-${{ needs.prepare.outputs.asset_time }}-quickjs-${{ matrix.portable_name }}-portable
          path: portable/*
          if-no-files-found: error

  mobile:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # rquickjs-sys compiles QuickJS C sources via cc; point cc at the NDK
      # cross clang for the Android target so the build script can compile.
      CC_aarch64_linux_android: aarch64-linux-android21-clang
      AR_aarch64_linux_android: llvm-ar
    steps:
      - uses: actions/checkout@v4

      - name: Install Android host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            llvm-dev libclang-dev clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            src-tauri/crates/tauritavern/gen/android/**/*.gradle*
            src-tauri/crates/tauritavern/gen/android/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Expose NDK clang on PATH for cc
        shell: bash
        run: |
          prebuilt="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$prebuilt" >> "$GITHUB_PATH"

      - name: Configure bindgen to use Android NDK sysroot
        shell: bash
        run: |
          sysroot="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$sysroot"
          } >> "$GITHUB_ENV"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Setup Android signing
        shell: bash
        run: |
          cd src-tauri/crates/tauritavern/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Enable HTTP access for standard Android bundle
        run: ./scripts/ci/configure-mobile-http.sh enable android

      - name: Build Android bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: android
          args: --verbose --apk --split-per-abi --target aarch64
          uploadWorkflowArtifacts: true
          uploadPlainBinary: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: 'TauriTavern-${{ needs.prepare.outputs.asset_time }}-quickjs-[platform]-[arch]-[bundle]'

  notes:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          PREVIOUS_SHA: ${{ needs.prepare.outputs.previous_sha }}
          SHA12: ${{ needs.prepare.outputs.sha12 }}
          DISPLAY_TIME: ${{ needs.prepare.outputs.display_time }}
        shell: bash
        run: |
          set -euo pipefail
          git log --format='- %s (`%h`)' "$PREVIOUS_SHA..$GITHUB_SHA" > changes.md
          {
            echo "> QuickJS feature build · Asia/Shanghai $DISPLAY_TIME · feature/quickjs-script-engine@$SHA12"
            echo
            echo "## Changes"
            cat changes.md
            echo
            echo "[Full comparison](https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_SHA}...${GITHUB_SHA})"
          } > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: quickjs-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, desktop, mobile, notes]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      ASSET_PREFIX: TauriTavern-${{ needs.prepare.outputs.asset_time }}-quickjs-
      DISPLAY_TIME: ${{ needs.prepare.outputs.display_time }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.stable_version }}
      DEB_VERSION: ${{ needs.prepare.outputs.deb_version }}
      RPM_RELEASE: ${{ needs.prepare.outputs.rpm_release }}
      FEATURE_TAG: ${{ needs.prepare.outputs.feature_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: 'TauriTavern-*-quickjs-*'
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: quickjs-release-notes
          path: notes

      - name: Validate desktop release set and pass Android artifacts through
        shell: bash
        run: |
          set -euo pipefail
          # Android artifacts are not part of the desktop naming table; copy
          # them out first so the strict desktop validator does not reject them.
          mkdir -p android-assets
          for artifact in dist/TauriTavern-*-quickjs-android-*; do
            [ -d "$artifact" ] || continue
            find "$artifact" -type f \( -name '*.apk' -o -name '*.aab' \) \
              -exec cp {} android-assets/ \;
          done
          # Rebuild a desktop-only artifact tree for the validator.
          mkdir -p desktop-dist
          for artifact in dist/TauriTavern-*-quickjs-*; do
            case "$(basename "$artifact")" in
              *-quickjs-android-*) continue ;;
            esac
            cp -r "$artifact" desktop-dist/
          done
          node source/scripts/ci/collect-desktop-release-assets.mjs desktop-dist release-assets "$ASSET_PREFIX" --best-effort
          # Merge Android artifacts into the release set with the shared prefix.
          for file in android-assets/*; do
            [ -f "$file" ] || continue
            cp "$file" "release-assets/${ASSET_PREFIX}android-$(basename "$file")"
          done

      - name: Install Linux package inspection tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Normalize Linux repository package versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debs < <(find release-assets -type f -name '*.deb')
          mapfile -t rpms < <(find release-assets -type f -name '*.rpm')
          # Best-effort: publish whatever Linux repo packages succeeded.
          # A partial run may yield only one arch, only debs, or only rpms;
          # if neither kind is present, skip this step entirely.
          if [[ "${#debs[@]}" -eq 0 && "${#rpms[@]}" -eq 0 ]]; then
            echo "No Linux repo packages (deb/rpm) found; skipping normalization."
            exit 0
          fi
          rpm_db="$RUNNER_TEMP/rpm-query-db"
          rpm --dbpath "$rpm_db" --initdb

          for package in "${debs[@]}"; do
            source/distribution/apt-rpm/rewrite-deb-version.sh "$package" "$DEB_VERSION"
          done
          for package in "${rpms[@]}"; do
            test "$(rpm --dbpath "$rpm_db" -qp --queryformat '%{VERSION}' "$package")" = "$PACKAGE_VERSION"
            test "$(rpm --dbpath "$rpm_db" -qp --queryformat '%{RELEASE}' "$package")" = "$RPM_RELEASE"
          done

      - name: Create or update Feature release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$FEATURE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$FEATURE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "QuickJS Feature Build $DISPLAY_TIME" \
              --notes-file notes/release-notes.md \
              --prerelease
          else
            gh release edit "$FEATURE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "QuickJS Feature Build $DISPLAY_TIME" \
              --notes-file notes/release-notes.md \
              --prerelease
          fi
          gh release upload "$FEATURE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            $(find release-assets -type f -name "${ASSET_PREFIX}*")
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/$FEATURE_TAG" \
            -f sha="$GITHUB_SHA" \
            -F force=true
