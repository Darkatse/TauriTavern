[package]
name = "tt-adapter-extension"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1"
reqwest = { workspace = true, features = ["json", "rustls", "socks"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["fs", "macros", "rt"] }
tracing = "0.1"
tt-adapter-http = { path = "../tt-adapter-http" }
tt-adapter-storage-core = { path = "../tt-adapter-storage-core" }
tt-domain = { path = "../tt-domain" }
tt-ports = { path = "../tt-ports" }
typed-path = "0.12"
url = "2.4"
uuid = { workspace = true }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
rand = { workspace = true }
