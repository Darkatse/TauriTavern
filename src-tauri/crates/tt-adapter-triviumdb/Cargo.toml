[package]
name = "tt-adapter-triviumdb"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
triviumdb = { workspace = true }
tt-contracts = { path = "../tt-contracts" }
tt-domain = { path = "../tt-domain" }
tt-ports = { path = "../tt-ports" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
