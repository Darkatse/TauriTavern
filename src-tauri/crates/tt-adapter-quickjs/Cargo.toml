[package]
name = "tt-adapter-quickjs"
version = "0.1.0"
edition = "2021"
description = "QuickJs script execution engine for Tauri Tavern skills"

[dependencies]
rquickjs = { version = "0.12.2", features = ["loader"] }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
# 只保留 spawn_blocking（rt）与 #[tokio::test]（macros）所需的最小 feature 集，
# 不继承 workspace 的 full。
tokio = { version = "1", features = ["rt", "macros"] }
tt-ports = { path = "../tt-ports" }
path-clean = "1.0"

# Android / iOS 目标没有预生成的 rquickjs 绑定，需开启 bindgen 在编译期实时生成。
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12.2", features = ["bindgen"] }

[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.12.2", features = ["bindgen"] }

[dev-dependencies]
tempfile = "3"
