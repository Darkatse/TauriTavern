[package]
name = "tt-adapter-quickjs"
version = "0.1.0"
edition = "2021"
description = "QuickJs script execution engine for Tauri Tavern skills"

[dependencies]
rquickjs = { version = "0.9", features = ["macro", "parallel", "loader"] }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
tt-domain = { path = "../tt-domain" }
tt-ports = { path = "../tt-ports" }
path-clean = "1.0"

[dev-dependencies]
tempfile = "3"
