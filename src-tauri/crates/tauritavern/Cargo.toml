[package]
name = "tauritavern"
version = "2.2.0"
description = "SillyTavern backend rebuilt with Tauri and Rust"
authors = ["TauriTavern Team"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauritavern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = { workspace = true }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-clipboard-manager = "2.3.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
tracing-appender = "0.2"
chrono = { workspace = true }
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io", "rt"] }
futures-util = "0.3"
reqwest = { workspace = true, features = ["http2", "json", "rustls", "socks", "stream"] }
bytes = "1"
base64 = "0.23"
uuid = { workspace = true }
async-trait = "0.1"
url = { workspace = true }
percent-encoding = "2"
regress = "0.11.1"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
mime_guess = "2.0.5"
filetime = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
dunce = "1"
tt-domain = { path = "../tt-domain" }
tt-contracts = { path = "../tt-contracts" }
tt-ports = { path = "../tt-ports" }
tt-application = { path = "../tt-application" }
tt-adapter-http = { path = "../tt-adapter-http" }
tt-adapter-mcp = { path = "../tt-adapter-mcp" }
tt-adapter-tokenization = { path = "../tt-adapter-tokenization" }
tt-adapter-sync = { path = "../tt-adapter-sync" }
tt-adapter-archive = { path = "../tt-adapter-archive" }
tt-adapter-extension = { path = "../tt-adapter-extension" }
tt-adapter-provider-http = { path = "../tt-adapter-provider-http" }
tt-adapter-vector = { path = "../tt-adapter-vector" }
tt-adapter-storage-core = { path = "../tt-adapter-storage-core" }
tt-adapter-storage-userdata = { path = "../tt-adapter-storage-userdata" }
tt-adapter-media = { path = "../tt-adapter-media" }
tt-adapter-quickjs = { path = "../tt-adapter-quickjs" }

# TT-Sync v2 shared protocol crates. (crates.io)
ttsync-contract = { workspace = true }
ttsync-core = { workspace = true }

[dev-dependencies]
tt-application = { path = "../tt-application", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-pilot = { version = "0.7.2", optional = true }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-winrt-notification = "0.7.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-background-tasks = "0.3.2"
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSFileManager", "NSItemProvider", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-uniform-type-identifiers", "UIActivity", "UIActivityItemsConfiguration", "UIActivityItemsConfigurationReading", "UIActivityViewController", "UIAlertController", "UIApplication", "UIControl", "UIDocumentPickerViewController", "UIPopoverPresentationController", "UIPresentationController", "UIResponder", "UIScrollView", "UITextField", "UIView", "UIViewController", "UIWindow", "UIGeometry"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSGeometry", "objc2-core-foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools-pilot = ["dep:tauri-plugin-pilot"]
portable = []
