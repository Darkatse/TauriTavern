[package]
name = "tt-adapter-vector"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
redb = "4.1.0"
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
tt-adapter-http = { path = "../tt-adapter-http" }
tt-domain = { path = "../tt-domain" }
tt-ports = { path = "../tt-ports" }

[dev-dependencies]
tempfile = { workspace = true }
