[package]
name = "tt-adapter-external-import"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
percent-encoding = "2"
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { version = "1", default-features = false, features = ["fs", "io-util"] }
tt-adapter-http = { path = "../tt-adapter-http" }
tt-domain = { path = "../tt-domain" }
tt-ports = { path = "../tt-ports" }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
