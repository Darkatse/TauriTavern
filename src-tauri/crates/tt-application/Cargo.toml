[package]
name = "tt-application"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-support = []

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { workspace = true }
headers = "0.4"
http = "1"
mime_guess = "2.0.5"
percent-encoding = "2"
rand = { workspace = true }
regress = "0.11.1"
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = "0.10"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"
tt-contracts = { path = "../tt-contracts" }
tt-domain = { path = "../tt-domain" }
tt-ports = { path = "../tt-ports" }
ttsync-contract = { workspace = true }
ttsync-core = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }
