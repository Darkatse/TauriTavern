[workspace]
members = [
    "crates/tauritavern",
    "crates/tt-domain",
    "crates/tt-contracts",
    "crates/tt-ports",
    "crates/tt-application",
    "crates/tt-adapter-http",
    "crates/tt-adapter-tokenization",
    "crates/tt-adapter-sync",
    "crates/tt-adapter-archive",
    "crates/tt-adapter-provider-http",
    "crates/tt-adapter-extension",
    "crates/tt-adapter-storage-core",
    "crates/tt-adapter-storage-userdata",
    "crates/tt-adapter-media",
]
default-members = ["crates/tauritavern"]
resolver = "3"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
ttsync-contract = "2"
ttsync-core = { version = "2", default-features = false }
ttsync-http = "2"
ttsync-client = "2"
uuid = { version = "1.4", default-features = false, features = ["serde", "std", "v4"] }
# Keep bundled libzstd target SIMD/assembly auto-detection; `no_asm` and `thin` disable fast paths.
zstd = { version = "0.13.3", default-features = false }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
