# Keep the root explicit so pnpm's dependency checks see the whole workspace.
packages:
  - '.'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  protobufjs: true
auditConfig:
  ignoreGhsas:
    # showdown has no fixed release: the advisories name 2.1.1, which was never
    # published. Every showdown result shown in the page is sanitized by
    # DOMPurify, so the two XSS advisories are unreachable. The link-parsing
    # ReDoS stays accepted until showdown publishes a fix; remove these entries
    # then.
    - GHSA-cr32-g25g-vxjj
    - GHSA-22g5-r2x5-97cx
    - GHSA-rmmh-p597-ppvv
enableGlobalVirtualStore: false
minimumReleaseAge: 0
overrides:
  lodash-es: 4.18.1
peerDependencyRules:
  allowedVersions:
    # Rstest still declares happy-dom ^20.8.3, but its docs and its own tests
    # support 21, and only 21.0.4 fixes GHSA-c8p4-j97h-3vg8 and
    # GHSA-834v-8h66-3h79. Remove this once Rstest widens the peer range.
    '@rstest/core>happy-dom': '21'
patchedDependencies:
  style-mod@4.1.3: patches/style-mod@4.1.3.patch
